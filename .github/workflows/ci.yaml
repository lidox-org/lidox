name: CI

on:
  pull_request:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: corepack enable

      - run: corepack npm ci

      - run: corepack npm run lint

      - run: corepack npm run typecheck

  tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: corepack enable

      - run: corepack npm ci

      - run: corepack npm run test:unit

      - run: corepack npm run test:integration

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: corepack enable

      - run: corepack npm ci

      - run: corepack npm run test:e2e:install

      - run: corepack npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - run: corepack enable

      - run: corepack npm ci

      - run: corepack npm run build
