name: CI (Lint, Typecheck & Build)

on:
  pull_request:
    branches: ["main"]

jobs:
  build-lint-test:
    name: Build, Lint, and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm' # or 'pnpm' / 'yarn'

      - name: Install dependencies
        run: npm install

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
